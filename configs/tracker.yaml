# tracker.yaml —— auto_aim 的"调参页"，只放**会随机器人 / 工况改**的值。
#
# 其余"设一次就不动"的内部常数（窗口长度、NIS 门限、初始协方差、handoff 平滑、
# 云台跟踪增益、UV 实验参数…）全部搬进结构体默认值：
#   Kalman/tracker.hpp、Kalman/armor_ekf.hpp、
#   control/{gimbal_aimer,target_selector,shooter,aim_signal_filter}.hpp、
#   estimation/rotation_rate_estimator.hpp、perception/detector.hpp
# 加载器 config_loader.hpp 里没写的项一律回落到那些默认值 —— 和 sp_vision 的
# configs/*.yaml 一个路子（那份 yaml 也只留模型 / 阈值 / 云台参数）。
#
# 判断标准：
#   放 yaml：① 标定值（相机内参、装甲板等效尺寸）② 模型 / 设备 / 阈值
#           ③ 机器人物理限制（云台速度、加速度、加加速度、俯仰范围）
#           ④ 随工况或战术调的增益 / 容差（速度阈值、延迟档、射击间隔、过程噪声）
#   放 hpp ：设一次就不动的结构常数、只在做实验时才动的开关的第二层参数
#
# 改这两边任何一处，都要用 tools/config_dump.cpp 核账（它打印真正加载进结构体的
# 每一个值）：
#   build_sim/config_dump > /tmp/before; ...改...; build_sim/config_dump > /tmp/after
#   diff /tmp/before /tmp/after      # 有效的值必须一行不差
tracker:
  # ---- 跟踪判定 ------------------------------------------------------------
  min_detect_frames: 3          # 进入稳定跟踪前需要连续检测到的帧数
  # 连续丢失超过该帧数后判定目标丢失。**必须 ≥ aim_pipeline.max_control_lost_frames**：
  # 否则 tracker 先判 LOST → 我们立刻停止控制 → 云台停住 → 板自己飘出画面 → 越丢越久。
  # 实测丢失频率高主要就是这么滚起来的（57Hz 下 25 帧 ≈ 0.44 s 的容错）。
  max_lost_frames: 25
  # 关联门限：**必须紧到能把"相邻/对角板"的观测挡在外面**。实测（2026-09-29 图像闭环
  # 日志）识别会在物理板之间跳，视轴偏差一帧跳 ±12~16°、位置差 0.35~0.5 m；原来 1.5 m/45°
  # 的门限把这些全放进来，闭环追着跳变就左右乱飞。而硬约束每帧都把模型钉在观测上，
  # 正常情况下预测与观测只差几毫米，所以收紧到 0.35 m 是安全的。
  max_match_distance: 0.35      # 观测装甲板与预测位置的最大匹配距离，单位：米
  reacquire_center_error: 0.25  # 重捕获时观测中心与预测中心的最大误差，单位：米
  max_camera_pose_dt: 0.05      # 图像时间戳与云台姿态时间戳允许的最大差值，单位：秒

  # ---- 收敛看门狗（对齐 sp_vision 的 recent_nis_failures + diverged）----------
  # 量测长期被拒 或 状态物理发散 或 帧间隔过长 → 立即判 lost 并用观测重新初始化
  # （不再硬撑着滑行）。三条判据分别对应 sp_vision 的 recent_nis_failures 比例、
  # Target::diverged()、以及 tracker.cpp 里的 `dt > 0.1s → lost`。
  watchdog_enabled: true
  watchdog_window: 20            # 统计窗口（只数有观测的帧）
  watchdog_reject_ratio: 0.4     # 窗口内量测被拒比例 ≥ 它 → 判不收敛
  watchdog_min_samples: 8        # 窗口里至少这么多帧才开始判
  watchdog_max_speed: 12.0       # |v| 上限 m/s（超出视为发散）
  watchdog_max_yaw_rate: 20.0    # |ω| 上限 rad/s
  watchdog_max_range: 30.0       # 位置模长上限 m
  watchdog_max_position_cov: 25.0  # P 的位置对角上限 m²
  watchdog_max_frame_gap: 0.20   # 帧间隔上限 s（相机离线 / 时间戳跳变判据）
  watchdog_min_converge_updates: 3  # 连续接受几帧才算"已收敛"（对齐 sp_vision 的 >3 帧）

  # ---- 单板硬约束 ----------------------------------------------------------
  # 打开：每帧把底盘中心平移，使"模型算出的这块板"**精确**落在观测位置上。
  #   → 单板工况下消掉稳态径向偏差，但代价是**观测噪声 1:1 进中心**
  #     （PnP 在 6 m 处抖动几厘米，中心就跟着抖几厘米 → 云台跟着抖）。
  # 关闭：完全交给 EKF 滤波（更平滑），偏差由 EKF 自己的量测更新收敛。
  # A/B 用 tools/replay_dataset 的"瞄点指令逐帧抖动 / 估计 vs 观测"两项判。
  hard_plate_constraint: true

  # 板号锁定：已关联的板只要代价不超过最优的该倍数就继续沿用。实测识别到的板会在物理板
  # 之间跳（视轴偏差一帧跳 ±12~16°），图像闭环追跳变永不收敛；1.0 = 关闭。
  plate_lock_margin: 1.35

  # ---- 局部拟合器（小陀螺 θ/ω；默认关）---------------------------------------
  # 把每帧灯条端点推进 Tracker 内部缓冲，低频异步拟合出绝对 yaw/角速度，
  # 作为强观测喂给 EKF（`ArmorEKF::updateWithLocalFit`）；正面观测时可跳过
  # 病态的单帧 PnP yaw。算法本体是可选组件 auto_aim_local_fit（Ceres），
  # Tracker 通过 setLocalFitter 注入。详见 docs/local_trajectory_fitter.md。
  # **默认 enabled: false —— 先只读不接管主链路，等仿真/真机验证稳定再打开。**
  local_fit:
    enabled: false
    window_frames: 24          # 滑窗帧数；覆盖相位 ≥ π/3 才有 ω 可辨识性
    min_bars: 8                # 窗口内至少这么多条灯条观测才拟合
    period_frames: 10          # 每多少帧触发一次（低频）
    max_result_age: 0.20       # s：**快层**(ω/yaw)结果比当前帧老过它就丢弃
    # **慢层**(R/α/h/中心)单独的工龄上限：拟合在低功耗机器上（NUC）要几百 ms，
    # 结果算出来就已经"几秒前"，用 0.2s 一刀切会把几何全丢掉（实车实测 geometry=0）。
    max_slow_result_age: 2.00
    max_window_gap_frames: 6   # 连续丢帧超过它就清窗（避免跨运动段）
    yaw_noise: 0.02            # 拟合 yaw 的观测噪声（rad²）
    omega_noise: 0.05          # 拟合 ω 的观测噪声
    # 相机系→整车系符号（标定项）：拟合器 θ 约定与 EKF ω 约定相反 → -1
    # （gyro5 A/B：+1 会把 EKF 的 ω 拉坏，-1 让 ω 明显更稳、更接近真值）
    yaw_rate_sign: -1.0
    # 把拟合出的**旋转中心**也当观测喂 EKF（默认关，A/B 用）。
    # 关：模型中心只能靠 hard_plate_constraint 钉在单块观测板上，擦边观测的 PnP
    #     位置误差 1:1 进中心 —— 自旋时重投影框会被单块板拖着跑（实测中心摆动 ±0.3 m）。
    # 开：再用整段弧拟合出的中心做一路位置观测（抖动小一个量级），center_noise 是它的
    #     位置方差（m²，0.01 → σ=0.1 m）。
    also_update_center: false
    center_noise: 0.01
    # 用拟合器慢层的 R 在线更新回转半径（默认开；拟合器没启用时这个开关不起作用）。
    # kalman.armor_radius=0.25 是一个静态标定值；拟合器在弧段上最小二乘出来的 R 是
    # 同一个物理量（仿真真值 0.210 / 在线收敛 0.200，实车 ≈0.20~0.24），
    # 差 4~5 cm 会 1:1 变成四块板的径向系统偏差。开启后限幅 + 一阶低通慢慢跟。
    # A/B（同一台仿真、3 rad/s）：开 → 模型对真板误差 0.170→0.145 m（R 收敛到 0.194）。
    use_fit_radius: true
    radius_alpha: 0.25         # 每次有效拟合最多跟 25% 的差值
    radius_max_step: 0.02      # 单次最大变化（m）
    # ---- 旋转中心先验（拟合器判运动状态）--------------------------------------
    # 拟合器在一个弧段上同时解出 (ω, 旋转中心平移速度 drift)：
    #   |ω| ≥ spin_min 且 |drift| < move_max → **纯旋转** → 旋转中心物理上不该动，
    #   把车心往拟合中心强拉（gain_rotating）；有平移时只轻拉（gain_other）。
    # 治的是"旋转中心被单块检测板的噪声拖着跑"，也给模型构造一个中心先验。
    # 判错的代价：纯旋转被当成平移 → 只是拉得慢一点，不会发散。
    # ⚠ 默认关：它会把车心往拟合中心拉（纯旋转 0.35/次），而车心本来由"硬钉到
    # 观测板"决定 —— 拟合中心依赖拟合器自己的几何(R/α/h)，几何没标好时这一拉会让
    # 模型整体偏离观测。实车单独 A/B 确认收益后再打开。
    center_anchor: false
    center_anchor_spin_min: 1.0        # rad/s
    center_anchor_move_max: 0.15       # m/s
    center_anchor_gain_rotating: 0.35
    center_anchor_gain_other: 0.10
    center_anchor_max_error: 0.60      # 拟合中心与车心差太多就不拉（m）


  # ---- 估计器（ArmorEKF）---------------------------------------------------
  kalman:
    # 底盘平移加速度过程噪声（静止档）。2026-09-26 在 6.5 m 靶上做的 A/B
    # （tools/auto_aim_sim_test.sh --pan 0.8，±2 m@0.8 m/s，速度是阶跃的，
    #   等价于实车按 WASD 那种"瞬时给速度"的操作），横向误差 p10/p90：
    #   常数 q=1  → -18.9/+24.3 cm，平移段"提前量欠量"中位 +48 ms
    #   常数 q=10 →  -9.6/+10.0 cm，                  +17 ms
    #   常数 q=30 →  -9.0/ +9.1 cm，                  +24 ms
    #   常数 q=100→ 决策占空 85%→36%，整轮丢靶
    # 但**常数调大在近距工况是回归**：1 m 靶上 q=10 连续 3 轮
    # FIRING 81/115/82 → 16/15/17。所以保留 1.0 作为"静止档"，
    # 由下面 speed_ref 按速度放大（物理含义：过程噪声 = 底盘加速度的不确定度，
    # 静止时它本来就该接近 0）。
    process_noise_pos: 1.0
    # qa = clamp(process_noise_pos·(1+(|v|/speed_ref)²), ·, process_noise_pos_max)
    # speed_ref=0.28 m/s 时：|v|=0.8 → qa≈9.2（≈实测最优的常数 10）；
    # |v|=0.2 → qa≈1.5（几乎就是静止档，近距静止工况不受影响）。
    process_noise_pos_speed_ref: 0.28
    process_noise_pos_max: 40.0
    process_noise_vel: 400.0    # 底盘角加速度过程噪声，用于适应小陀螺
    measure_noise: 0.01         # 距离测量方差，单位：平方米
    armor_radius: 0.25          # 装甲板回转半径，单位：米
    # 重投影整车模型按观测延迟外推时，**中心**是否也按底速平移。
    # 自旋工况实测（同一台仿真、3 rad/s、3 m、有真值）：只推 yaw → 模型相位偏差
    # 29.2°→11.7°；连中心一起推 → 相位同样 12.7°，中心误差 0.162→0.170 m。
    # 也就是"中心也推"在自旋上只差 8 mm（小陀螺时底盘平移本来就不可观测，
    # v 被"硬钉 + 板绕中心转"的耦合污染），但在**平移靶**上它补的是 v·0.11 s
    # ≈9 cm 的系统滞后 —— 所以默认开，纯自旋观测工况可以关掉换那 8 mm。
    # 瞄准那条路由选择器按 v·提前量自己补过，与这里无关（不要重复补）。
    model_lead_center: true
    # 距离噪声随距离增长的系数。实测：4 m 距离帧间抖动中位 0.17 m、p90 0.48 m；
    # 7.5 m 靶面只剩 ~10 px，噪声远大于 0.1 的模型（σ≈0.26 m）。取 0.3 →
    # 4 m σ≈0.16 m、7.5 m σ≈0.42 m，与实测同量级（否则滤波器会 2~5 倍高估距离
    # 可信度，表现为距离乱跳 / 提前量不准）。
    range_noise_distance_scale: 0.3
    # ---- 高速自旋（小陀螺）通用关联/NIS：见 tracker.hpp 的注释 --------------
    # 关联角门限跟着滤波器自身的 yaw 标准差放大，收敛后自动收窄；上限必须 < 90°
    # （否则相邻物理板会落进同一门限）。固定 20° 门限在 5 rad/s 下几帧就顶穿，
    # 是"小陀螺不收敛"的直接原因（实测：放松门限后 ω 从 0 收敛到 4.73 rad/s）。
    adaptive_association_gate: true
    association_gate_sigma: 1.5
    association_gate_max: 1.30
    # PnP 平面解 yaw 的可信门限（度；0 = 关闭门控 → 回到老行为，A/B 用）。
    # 平面靶 IPPE 有**两个解**，同一块板的 yaw 会来回跳（实测视轴差 ±12°，极端镜像）；
    # 本车装甲板法向 = 径向，yaw 一翻整台底盘模型就跟着转（现场就是"重投影模型误差
    # 不可接受"）。所以：关联**不再用 yaw 做硬门限**（改用 bearing 距离，米），只有
    # 当它和滤波器预测一致（≤ 本值）时才把 yaw 算进代价、才让 EKF 用它的 yaw 分量；
    # 不一致就当"这一帧没测到 yaw"，位置照用、yaw 由 ω 外推 + 拟合器慢层给。
    # ⚠ 现场 A/B 结论（2026-10-10 晚）：**先保持 0（关闭）**。
    # 原因：这个门控拿"滤波器自己的预测"当参照 —— 一旦滤波器 yaw 初始就偏得多
    # （刚上电/翻解后），它会永远拒绝所有 yaw 观测 → yaw 再也回不来（自锁）。
    # 要重新启用，先解决"参照量不能是滤波器自己的 yaw"，否则实车会更差。
    pnp_yaw_trust_deg: 0.0
    # 硬约束：用来构造底盘的那块板一定是**离相机最近**的那块（现场事实）——
    # 车心（以及另外三块板）必须比它更远/画面上更靠上。违反说明模型的径向翻了 180°
    # （PnP 法向翻号 / 关联到对面板），把底盘 yaw 翻回来重摆。
    # margin 是"明显违反才翻"的缓冲（m），防抖。
    # ⚠ 默认关：第一版判据用了"到相机的距离"，±90° 的侧板距离本来就大于车心 →
    # 误触发、yaw 每帧翻 180°。现已改成**沿视轴深度**判据（见 tracker.cpp），
    # 但要在实车上单独 A/B 确认后再打开（配合 Tracker::nearestPlateFlips() 诊断）。
    nearest_plate_constraint: false
    nearest_plate_margin_m: 0.05
    # ---- 观测慢收敛：底盘几何自己学（默认开）-----------------------------------
    # 在硬钉**之前**量"观测板心 − 模型板心"，径向分量低通进该板回转距离、竖直分量
    # 低通进该板高度 —— 这就是"即使四块板不同远/不同高，也按观测收敛"。
    # 现场意义：plate_distance 不用手量了，跑一段它自己收敛（状态行打印 Rgeo）。
    # 单帧最多修 4 mm、残差 > 5 cm 视为翻解/关联错当帧不学、相对初值最多漂 ±8 cm。
    geometry_learn: true
    geometry_learn_gain: 0.05
    geometry_learn_max_step: 0.004
    geometry_learn_max_error: 0.05
    geometry_learn_range: 0.08
    # 逐板**高度**学习（默认关）：硬钉下车心 y 与板高不可分，开了会随机游走、
    # 把模型整体抬/压几十 px（实车实测 model_fit 从 8px 涨到 70~86px）。
    # 真机四块板同高是硬件事实，保持 0；要试就配合 status 行的 Hgeo= 看。
    geometry_learn_height: false
    # 距离门限同理随距离噪声放大（上限 m）；角度门限仍是主判据，不会放进相邻板。
    range_gate_sigma: 2.0
    range_gate_max: 1.00
    # 马氏距离关联（上科大 2026 §5B.4）：d²=rᵀS⁻¹r，门限=χ²(4,95%)=9.488。
    # 它按滤波器自身协方差 S=H·P·Hᵀ+R 自校准，比固定/自适应角度门限更正统。
    # 关掉 = 回到上面的 adaptive_association_gate 启发式（A/B 用）。
    # 默认关：马氏门限依赖 R 与真实误差一致；当前远距 PnP 噪声（6.5 m 靶面 13 px）
    # 比现有 R 大得多，开了反而接受率下降。等做完 fit_single + R 标定（文档 §5A.4/§5B.2）
    # 再打开。开关已实现并有单测覆盖。
    mahalanobis_matching: false
    association_chi2: 9.488
    # 物理量纲的 YPD 距离噪声系数：σ_dist = coeff·d（上科大 2026 §5B.2，范围 0.05~0.20）。
    # 0 = 回到 measure_noise·(1+range_noise_distance_scale·d²) 的旧模型。
    ypd_distance_sigma_coeff: 0.0
    # NIS 降级为诊断量（对齐 sp_vision：始终应用更新、只统计失败率）。
    # 关掉 = 恢复旧的硬门限行为（A/B 用）。
    soft_nis_gate: true
    # ---- 双模型（上科大 2026 §9.4.4）--------------------------------------
    # 并行维护装甲板模型（直接跟踪可见板），低速时比整车模型少一层"半径/切向不可
    # 观测"约束。第一阶段只并行运行、不参与输出；输出切换下一片再做。
    plate_model_enabled: false
    plate_model_process_acc: 20.0
    plate_model_process_yaw_acc: 50.0
    plate_model_enter_omega: 0.7
    plate_model_exit_omega: 2.7
    uv_armor_height: 0.060        # 重投影用的板高（必须与 pnp 段语义一致）

  # ---- 装甲板几何（标定值，不是"标准尺寸"）---------------------------------
  # 这三个数是"等效物点尺寸"：网络的四个关键点不是 135×125 板的四角，
  # 物点模型要匹配**检测器的点语义**。2026-09-26 离线用录下的角点重解 PnP 标定：
  #   0.134/0.057 → 距离偏置中位 +15.8 mm；0.1315/0.060 → 中位 −1.7 mm、均值 ≈0。
  # 重新标定方法见 docs/uv_observation.md §标定。
  pnp:
    small_width: 0.1315         # 小装甲板等效宽度，单位：米
    large_width: 0.221          # 大装甲板等效宽度（按同样比例修正，待大板数据标定）
    height: 0.060               # 装甲板等效高度，单位：米
    # PnP 降自由度：固定 tvec 与竖直板约束，只在方位角上做 1D 重投影精修
    # （fit_single，上科大 2026 §5A.4）。提升 armor_yaw（径向角）精度 ——
    # 它是 EKF 估计 ω 与关联板号的关键观测量。
    # 默认关：1D 精修的收益取决于角点噪声与装甲板俯仰角。实测 3 m/0.3 px 下
    # 只把径向角误差从 1.74° 降到 1.56°（~10%）；且 armor_pitch_deg 必须与实车一致。
    # 建议：先标定实车俯仰角、并把角点精修（PCA/边缘）打开后再启用。
    yaw_refine: false
    yaw_refine_span_deg: 70.0
    yaw_refine_coarse_deg: 5.0
    armor_pitch_deg: 15.0
    # ---- 底盘模型（真车是矩形，不是圆）----------------------------------------
    # 四块板到**车心**的水平距离（米，按板号 0=+90°,1=正面,2=−90°,3=背面）。
    # 不给（或给 0）→ 四块都用 kalman.armor_radius，即"圆"（仿真靶就是圆）。
    # 真车请实测：把车摆正、量车心到四个板面的距离，例如 [0.28,0.22,0.28,0.22]。
    # 这个值差 3~5 cm，重投影就会"四块板有的贴、有的飞"。
    plate_distance: []
    # 哪几块是**大**装甲板（真机常见前后大、左右小；仿真靶四块一样）。
    # 只影响画框宽度（板面等效尺寸用的是 large_width/small_width）。
    plate_large: [false, false, false, false]

  # ---- 云台（机器人物理限制；换车只改这一段）-------------------------------
  # 选择器估算"云台转过去要多久"直接复用这里的角速度 / 角加速度，不再重复配置。
  gimbal:
    # pitch 限位与"最大角速度"**必须与下位机一致**，否则我们的轨迹会去要求机器到不了
    # 的角度/速度：表现为"顶到限位回不来""跟不上、响应慢"。
    # 2026-09-29 从这台车的电控代码抄回来（wheel_leg_2/gimbal/application/gimbal_task.c）：
    #   #define Pitch_Max_Angle -0.49f   #define Pitch_Min_Angle 0.27f   →  [-28.1°, +15.5°]
    #   Angle_Control_Limit(&Gimbal_Pitch_Control_Data, Pitch_Max_Angle, Pitch_Min_Angle)
    #   视觉目标按固定步长 0.003 rad / 1 ms 周期逼近 → 最大 ≈3 rad/s = 172°/s（yaw/pitch 同）
    #   （Yaw_Divide_Plus_x = Pitch_Divide_Plus_x = 0.003f，GIMBAL_CONTROL_TIME = 1ms）
    # 注意上限只有 +15.5°：靶板举得太高时本来就打不到，这是机械/限位事实，不是控制 bug。
    pitch_min_degrees: -28.1       # 最小俯仰角（= 下位机 Pitch_Max_Angle -0.49 rad）
    pitch_max_degrees: 15.5        # 最大俯仰角（= 下位机 Pitch_Min_Angle 0.27 rad）
    max_yaw_velocity_degrees_per_sec: 172.0    # = 下位机视觉步长 0.003rad/1ms
    max_pitch_velocity_degrees_per_sec: 172.0
    max_yaw_acceleration_degrees_per_sec2: 1800.0    # 最大偏航角加速度
    max_pitch_acceleration_degrees_per_sec2: 1200.0  # 最大俯仰角加速度
    max_yaw_jerk_degrees_per_sec3: 20000.0     # 最大偏航加加速度
    max_pitch_jerk_degrees_per_sec3: 12000.0   # 最大俯仰加加速度
    command_rate_hz: 100.0         # 云台轨迹计算和发送频率，单位：赫兹

  # ---- 目标选择 / 弹道（战术参数）------------------------------------------
  selector:
    enabled: true                # 是否启用目标选择器
    projectile_speed: 25.0       # 弹丸初速度，单位：米/秒
    gravity: 9.81                # 重力加速度，单位：米/秒²
    command_latency: 0.08        # 云台指令下发并生效的延迟，单位：秒
    max_lead_time: 0.50          # 最大允许提前预测时间，单位：秒
    # 检测丢失时继续由我们控制（发"保持上一拍瞄点"）的最大帧数。90fps 下 25 帧 ≈ 0.28s：
    # 之前 5 帧（≈55ms）太短，检测一断我们就把控制权交回下位机（mode=0）→ 遥控摇杆/它自己的
    # 积分把云台带走（实测：无识别时云台自己从 26° 飘到 60°）。要"丢失就松手"就把它调回 5。
    max_control_lost_frames: 25
    # 延迟补偿分档：快速旋转时用更大的提前量（参考实现用 decision_speed +
    # high/low_speed_delay_time 做同样的分档），慢速时用小值避免过头。
    decide_speed: 7.0            # 判定"高速旋转"的角速度阈值，单位：弧度/秒
    low_speed_latency: 0.06      # 低速档的指令延迟补偿，单位：秒
    high_speed_latency: 0.13     # 高速档的指令延迟补偿，单位：秒
    # 板号锁定：已选中的板只要仍在可打范围内就保持锁定，除非另一块明显更优
    # （代价低于锁定板的该比例时才允许切换），防止在两块角度相近的板之间来回跳。
    lock_switch_margin: 0.65
    # ---- 静止靶闸门（2026-09-29）------------------------------------------
    # 实车静止靶实测：EKF 的 |v| p90=200 mm/s，|ω| p90=3.7°/s、p99=33°/s，
    # 而提前量是 386 ms —— ω 的噪声尾巴会让瞄点相位错 7~22°（= 4.8° 的甩动）。
    # 超过 enter 阈值才按"在动"处理（给提前量 + 给云台速度前馈）；
    # 低于 exit 阈值当静止（两者都清零）；中间是滞回带，保持上次判定。
    motion_gate_enabled: true
    motion_gate_enter_speed: 0.50   # m/s：真实平移（≥0.5 m/s）立刻通过
    motion_gate_exit_speed: 0.30    # m/s：滞回带下沿
    motion_gate_enter_omega: 1.00   # rad/s(57°/s)：小陀螺(1.5~3 rad/s)立刻通过
    motion_gate_exit_omega: 0.50    # rad/s(29°/s)
    spin_omega_threshold: 2.0    # 超过该角速度后进入小陀螺选板模式，单位：弧度/秒
    # ---- 按估计转速分档（2026-10-05）------------------------------------
    # |ω| > chase_omega_threshold 后"追最近板"物理上不可能（云台 172°/s = 3.0
    # rad/s，板换位间隔 90°/ω 小于云台摆 90° 的 0.52 s），改为"守角+等板进窗"：
    # 瞄预测的底盘中心，等板扫过视轴。实测 2/3/5 rad/s 的 TRACKING 占空 52/47/14%。
    # 略低于理论边界 3.0（=172°/s）：留出加速度/加加速度的余量，3 rad/s 也走守角档。
    chase_omega_threshold: 2.5
    spin_hold_enabled: true
    spin_fire_tolerance_degrees: 6.0
    coming_angle_degrees: 60.0   # 装甲板进入可射击扇区的角度范围，单位：度
    leaving_angle_degrees: 20.0  # 装甲板离开可射击扇区的判定角度，单位：度

  shooter:
    min_fire_interval: 0.10            # 两次发射之间的最短时间间隔，单位：秒
    fire_angle_tolerance_degrees: 3.0  # 云台与选择器瞄点的最大允许角误差，单位：度
