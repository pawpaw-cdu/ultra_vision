# sp_vision_25（NUC 上实跑的那份）的相机内外参 —— 原样抄自
#   nuc:~/sp_vision_25/configs/standard3.yaml   (2026-10-10 19:50 的现场版本)
# 用途：tools/spv_replay 用它当 sp_vision 侧的相机模型（--spv-yaml，默认就是本文件）。
#
# **为什么不用 configs/camera.yaml 里那组**：那份 R_camera2gimbal 与 sp_vision 期望的
# 约定不一致（实测直接把重投影指标从 3.4px 打到 149px，同一份数据）；NUC 上这份是
# 现场验证过、能让 sp_vision 跑出好效果的那一组。注意本地 sp_vision 仓库里的
# standard3.yaml 与 NUC 上这份也不同（内参 1785 vs 2405），现场版本以本文件为准。

R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

# 1440x1080（与 Ultra_Vision 同一台海康相机；我们的标定是 2398.73/726.559/565.457）
camera_matrix: [2405.58, 0, 722.885, 0, 2403.36, 567.321, 0, 0, 1]
distort_coeffs: [-0.0341126, 0.405069, -2.87266e-06, -9.79784e-05, -1.65009]

# 相机→云台（现场标定）
R_camera2gimbal: [-0.027182119030230909, -0.12616154330853446, 0.99163723074269183,
                  -0.98649106557517331, 0.019998323121329122, -0.024853106601381177,
                  -0.016095575474690555, -0.99180811252093692, -0.12664093215554434]
t_camera2gimbal: [0.0860669975045827, 0.13548944634136512, 0.068130892889120886]
