# detector.yaml —— 只放"换模型 / 换机器要改"的东西。
# 传统灯条检测器的那套阈值（light/armor/color/binary_threshold）已搬进
# perception/detector.hpp 的结构体默认值：neural.enabled 为 true 时它整套都不参与，
# 需要调传统路径时改那头的默认值，或者在这里重新写回同名段（加载器仍然会读）。
detector:
  # 1 = 红方，0 = 蓝方。神经网络路径用它做颜色筛选（filter_by_color 打开时）。
  enemy_color: 0

  # 神经网络装甲板检测器（YOLO 四点模型 / RP24 头，OpenVINO 部署）。
  # enabled: true 时用它替代传统灯条流程；两者输出同一种 Armor 类型，
  # 后续 PnP、整车估计和控制链完全不变。
  neural:
    enabled: true
    model_path: "models/openvino/yolov5.xml"   # 相对路径按 configs 的上级目录解析
    device: "CPU"                             # CPU / GPU / AUTO
    output_format: "rp24"                     # yolo11 | rp24
    # 实测权衡（同一套仿真场景 / 确定性复位）：
    #   rp24  (yolov5+MobileNetV3): 推理 15-21 ms，检测 15.1 fps，观测误差 median 10.0 cm
    #   yolo11 (38 类)            : 推理 56-78 ms，检测  4.0 fps，观测误差 median  1.6 cm
    # 即：轻量模型快 3.8 倍，但定位精度差约 6 倍。追求帧率用 rp24，追求精度用 yolo11。
    input_size: 640
    score_threshold: 0.25
    nms_threshold: 0.5
    min_confidence: 0.25
    # 默认不做颜色过滤：模型会把未点亮的装甲板判成 extinguish(灰)，
    # 按颜色筛会直接丢掉这些有效目标（sp_vision 的神经网络路径也不筛颜色，
    # 只校验编号与大小）。需要只打某一方时，交给目标选择层去做。
    filter_by_color: false
    # 部署机相关的调度参数（实测 4 线程最优：默认 8 会与仿真器抢核）。
    performance_mode: "latency"               # latency / throughput
    num_threads: 4
    num_streams: 1                            # 0 = OpenVINO 默认
    # 角点精修：以网络输出的四角为先验，在局部 ROI 内重新提取灯条并用灯条端点
    # 重建角点；几何一致性不通过时自动退回网络原值（详见 keypoint_refiner.cpp）。
    refine:
      enabled: true
      binary_threshold: 150                   # 局部 ROI 的灰度二值化阈值
      margin_ratio: 0.15                      # ROI 相对网络框的外扩比例
      max_center_shift_ratio: 0.08            # 精修后板中心最大位移（相对板宽）
    use_roi: false
    roi: {x: 0, y: 0, width: -1, height: -1}
