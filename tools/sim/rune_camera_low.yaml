# 能量机关仿真的测试相机预置：实车高度（相机离地约 0.55 m）
#
# 比赛里相机不可能和 R 标（圆心，约 2.45 m 高）平行，所以这里把相机放到离地
# 0.55 m、水平距离约 6 m，`looking_at` 指向圆心——视线相对转轴抬高约 18°。
# 这是比"与圆心等高"更接近实战的观测条件：圆盘在画面里变成椭圆（纵向压缩
# cos18°≈0.95），靶面 PnP 与角点网络都要在这种斜视下工作。
scenario: energy_rune
fov_degrees: 45.0

energy_rune:
  position: [-4.512, 0.55, -4.424]
  target: [-0.16, 2.45, -0.22]

armor_chassis:
  position: [1.0, 0.25, 0.0]
  target: [0.0, 0.15, 0.0]

guided_dart:
  position: [0.0, 3.0, 0.0]
  target: [13.0, 9.0, -95.0]
